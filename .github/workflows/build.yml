name: Build LockSpectrum (One-Click)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Install dependencies
        run: brew install ldid xz

      - name: Clone Theos
        run: git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Download iOS SDKs
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git sdks-temp
          cp -r sdks-temp/*.sdk $THEOS/sdks/
          rm -rf sdks-temp

      - name: Generate source files
        run: |
          mkdir -p prefs
          echo '' | base64 -d > Makefile
          echo '' | base64 -d > control
          echo '' | base64 -d > Tweak.xm
          echo '' | base64 -d > LSPAudioCapture.h
          echo '' | base64 -d > LSPAudioCapture.m
          echo '' | base64 -d > LSPSettingsManager.h
          echo '' | base64 -d > LSPSettingsManager.m
          echo '' | base64 -d > LSPSpectrumView.h
          echo '' | base64 -d > LSPSpectrumView.m
          echo '' | base64 -d > prefs/Makefile
          echo '' | base64 -d > prefs/entry.plist
          echo 'I2ltcG9ydCA8UHJlZmVyZW5jZXMvUHJlZmVyZW5jZXMuaD4KCkBpbnRlcmZhY2UgTFNQUm9vdExpc3RDb250cm9sbGVyIDogUFNMaXN0Q29udHJvbGxlcgpAZW5kCg==' | base64 -d > prefs/LSPRootListController.h
          echo '' | base64 -d > prefs/LSPRootListController.m
          echo 'IyBUaGVvcyBidWlsZCBhcnRpZmFjdHMKcGFja2FnZXMvCm9iai8KLnRoZW9zLwoqLmRlYgoqLnRhcgoqLnRhci5negoqLnRhci54egoKIyBYY29kZQoqLnhjb2RlcHJvagoqLnhjd29ya3NwYWNlCi5EU19TdG9yZQoKIyBFZGl0b3IKKi5zd3AKKi5zd28KKn4KLnZzY29kZS8KLmlkZWEvCgojIExvZ3MKKi5sb2cK' | base64 -d > .gitignore

      - name: Verify files
        run: |
          ls -la
          ls -la prefs/
          echo '--- Makefile ---'
          head -5 Makefile

      - name: Build package
        run: |
          export PATH=$THEOS/bin:$PATH
          make clean package FINALPACKAGE=1

      - name: List output
        run: ls -la packages/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v3
        with:
          name: LockSpectrum-deb
          path: packages/*.deb
          retention-days: 30
