name: Build LockSpectrum

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Install dependencies
        run: |
          brew update
          brew install ldid xz
          echo '--- ldid version ---'
          ldid --version 2>&1 || true

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo '--- Theos version ---'
          cd $THEOS && git log --oneline -1
          ls $THEOS/bin/
          mkdir -p $THEOS/sdks

      - name: Download iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git sdks-temp
          echo '--- Available SDKs ---'
          ls -d sdks-temp/iPhoneOS*.sdk 2>/dev/null
          # 只复制 iPhoneOS SDK，跳过其他平台（AppleTVOS/WatchOS 等可能有损坏链接）
          cp -R sdks-temp/iPhoneOS*.sdk $THEOS/sdks/ 2>/dev/null || true
          echo '--- Installed iPhoneOS SDKs ---'
          ls -d $THEOS/sdks/iPhoneOS*.sdk
          # 确保至少有一个 SDK
          if ! ls -d $THEOS/sdks/iPhoneOS*.sdk >/dev/null 2>&1; then
            echo 'ERROR: No iPhoneOS SDK found!'
            exit 1
          fi
          rm -rf sdks-temp

      - name: Generate source files
        run: |
          mkdir -p prefs
          echo '' | base64 -D > Makefile
          echo '' | base64 -D > control
          echo '' | base64 -D > Tweak.xm
          echo '' | base64 -D > LSPAudioCapture.h
          echo '' | base64 -D > LSPAudioCapture.m
          echo '' | base64 -D > LSPSettingsManager.h
          echo '' | base64 -D > LSPSettingsManager.m
          echo '' | base64 -D > LSPSpectrumView.h
          echo '' | base64 -D > LSPSpectrumView.m
          echo '' | base64 -D > prefs/Makefile
          echo '' | base64 -D > prefs/entry.plist
          echo 'I2ltcG9ydCA8UHJlZmVyZW5jZXMvUHJlZmVyZW5jZXMuaD4KCkBpbnRlcmZhY2UgTFNQUm9vdExpc3RDb250cm9sbGVyIDogUFNMaXN0Q29udHJvbGxlcgpAZW5kCg==' | base64 -D > prefs/LSPRootListController.h
          echo '' | base64 -D > prefs/LSPRootListController.m
          echo 'IyBUaGVvcyBidWlsZCBhcnRpZmFjdHMKcGFja2FnZXMvCm9iai8KLnRoZW9zLwoqLmRlYgoqLnRhcgoqLnRhci5negoqLnRhci54egoKIyBYY29kZQoqLnhjb2RlcHJvagoqLnhjd29ya3NwYWNlCi5EU19TdG9yZQoKIyBFZGl0b3IKKi5zd3AKKi5zd28KKn4KLnZzY29kZS8KLmlkZWEvCgojIExvZ3MKKi5sb2cK' | base64 -D > .gitignore
          echo '--- Files generated ---'
          ls -la
          ls -la prefs/

      - name: Build package
        run: |
          export PATH=$THEOS/bin:$PATH
          echo '--- THEOS = '$THEOS
          echo '--- PATH = '$PATH
          echo '--- which theos ---'
          which theos 2>&1 || echo 'theos command not in PATH (ok, using make directly)'
          echo '--- Start build ---'
          make clean package FINALPACKAGE=1 2>&1
          echo '--- Build exit code: '$?

      - name: List output
        run: |
          echo '--- packages/ ---'
          ls -la packages/ 2>&1
          echo '--- Find deb ---'
          find . -name '*.deb' -type f 2>/dev/null

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockSpectrum-deb
          path: '**/*.deb'
          retention-days: 30
